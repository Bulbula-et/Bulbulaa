name: Bulbula.et CI — Security, Static Analysis and E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulbula-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} quality and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, json, mbstring, openssl, pdo_sqlite, sodium, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest and lockfile
        run: composer validate --strict

      - name: Install pinned dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit dependency security advisories
        run: composer audit --locked --no-interaction

      - name: PHP syntax validation
        run: find src config public_html tests database -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPStan static analysis
        run: php vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit unit and security tests
        run: php vendor/bin/phpunit

      - name: Atomic rate-limiter concurrency test
        run: tests/rate_limiter_concurrency.sh

      - name: Atomic configuration concurrency test
        run: tests/config_update_concurrency.sh

      - name: Production debug and pilot-data lockout
        run: tests/production_preflight.sh

      - name: Rebuild deterministic SQLite test database
        run: php database/init_sqlite.php

      - name: Apply and verify idempotent database migrations
        run: |
          php database/migrate.php migrate
          php database/migrate.php migrate | grep -q 'already current'
          php database/migrate.php status | grep -q '^APPLIED'

      - name: Rehearse isolated SQLite backup and restore integrity
        run: php tests/backup_restore_rehearsal.php

      - name: Generate origin-aware static robots artifact
        run: php database/generate_robots.php

      - name: Start application test server
        run: |
          BULBULA_GOOGLE_CLIENT_ID=123456-ci.apps.googleusercontent.com BULBULA_TELEGRAM_BOT_TOKEN=123456:ci-telegram-bot-token-not-real php -d opcache.enable_cli=0 -S 127.0.0.1:8080 -t public_html public_html/router.php > storage/logs/ci-server.log 2>&1 &
          echo $! > /tmp/bulbula-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 0.5
          done
          cat storage/logs/ci-server.log
          exit 1

      - name: Public, API, SEO and Staff route verification
        run: php tests/verify_v1_all.php

      - name: Automated launch assurance baseline
        run: php tests/launch_assurance.php

      - name: Web and Telegram surface adapter smoke checks
        run: node tests/surface_adapter_smoke.js

      - name: Browser security headers and CSP nonce verification
        run: tests/security_headers.sh

      - name: Authenticated CSRF, staff RBAC and customer OTP E2E flows
        run: tests/e2e_flows.sh

      - name: Browser-to-Mini-App Google handoff isolation E2E
        run: bash tests/google_bridge_flow.sh

      - name: Verified Telegram cross-device account link and revocation E2E
        env:
          BULBULA_TELEGRAM_BOT_TOKEN: 123456:ci-telegram-bot-token-not-real
        run: bash tests/telegram_link_flow.sh

      - name: Show server log on failure
        if: failure()
        run: cat storage/logs/ci-server.log || true

      - name: Stop application server
        if: always()
        run: test ! -f /tmp/bulbula-server.pid || kill "$(cat /tmp/bulbula-server.pid)" || true

  mariadb-parity:
    name: MariaDB 10.11 schema, migrations and authenticated E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: bulbula_ci
          MARIADB_USER: bulbula
          MARIADB_PASSWORD: bulbula_ci_password
          MARIADB_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BULBULA_TELEGRAM_BOT_TOKEN: 123456:ci-telegram-bot-token-not-real
      BULBULA_APP_ENV: development
      BULBULA_DB_DRIVER: mysql
      BULBULA_DB_HOST: 127.0.0.1
      BULBULA_DB_PORT: 3306
      BULBULA_DB_NAME: bulbula_ci
      BULBULA_DB_USER: bulbula
      BULBULA_DB_PASSWORD: bulbula_ci_password
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with native MySQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, json, mbstring, openssl, pdo_mysql, sodium
          coverage: none
          tools: composer:v2
      - name: Install pinned dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - name: Import production schema and pilot fixture
        run: |
          mysql --protocol=TCP -h127.0.0.1 -P3306 -ubulbula -pbulbula_ci_password bulbula_ci < database/schema_v1_mysql.sql
          mysql --protocol=TCP -h127.0.0.1 -P3306 -ubulbula -pbulbula_ci_password bulbula_ci < database/seeds/seed_v1_pilot.sql
      - name: Apply and verify MySQL migrations
        run: |
          php database/migrate.php migrate
          php database/migrate.php migrate | grep -q 'already current'
          php database/migrate.php status | grep -q '^APPLIED'
          test "$(php tests/db_test_tool.php scalar 'SELECT DATABASE()')" = 'bulbula_ci'
      - name: Rehearse isolated MariaDB logical backup and restore
        env:
          BULBULA_RESTORE_ADMIN_USER: root
          BULBULA_RESTORE_ADMIN_PASSWORD: root_ci_password
        run: bash tests/mariadb_restore_rehearsal.sh
      - name: Start MySQL-backed application
        run: |
          BULBULA_GOOGLE_CLIENT_ID=123456-ci.apps.googleusercontent.com BULBULA_TELEGRAM_BOT_TOKEN=123456:ci-telegram-bot-token-not-real php -d opcache.enable_cli=0 -S 127.0.0.1:8080 -t public_html public_html/router.php > storage/logs/ci-mariadb-server.log 2>&1 &
          echo $! > /tmp/bulbula-mariadb-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 0.5; done
          cat storage/logs/ci-mariadb-server.log
          exit 1
      - name: MySQL repository, route and authenticated mutation parity
        run: |
          php tests/verify_v1_all.php
          tests/security_headers.sh
          tests/e2e_flows.sh
          bash tests/google_bridge_flow.sh
          bash tests/telegram_link_flow.sh
      - name: Show MariaDB server log on failure
        if: failure()
        run: cat storage/logs/ci-mariadb-server.log || true
      - name: Stop MySQL-backed application
        if: always()
        run: test ! -f /tmp/bulbula-mariadb-server.pid || kill "$(cat /tmp/bulbula-mariadb-server.pid)" || true
